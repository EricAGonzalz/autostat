name: Update CFB Rankings

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cfb-rankings-update
  cancel-in-progress: true

jobs:
  update-rankings:
    runs-on: ubuntu-latest

    env:
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}

    steps:
      - name: Determine CFB season
        shell: bash
        run: |
          CALENDAR_YEAR=$(date -u +%Y)
          MONTH=$(date -u +%m)

          if [ "$MONTH" = "01" ]; then
            CFB_YEAR=$((CALENDAR_YEAR - 1))
          else
            CFB_YEAR=$CALENDAR_YEAR
          fi

          echo "CFB_YEAR=$CFB_YEAR" >> "$GITHUB_ENV"
          echo "Current CFB season: $CFB_YEAR"

      - name: Check out private autostat repo
        uses: actions/checkout@v4

      - name: Check out public rankings repo
        uses: actions/checkout@v4
        with:
          repository: EricAGonzalz/CFBRankings
          token: ${{ secrets.CFB_PUBLISH_TOKEN }}
          path: public-repo

      - name: Restore existing ranking history
        shell: bash
        run: |
          mkdir -p "data/history/${CFB_YEAR}"

          if [ -f "public-repo/data/${CFB_YEAR} History.csv" ]; then
            cp "public-repo/data/${CFB_YEAR} History.csv"                "data/${CFB_YEAR} History.csv"
          fi

          if [ -d "public-repo/data/history/${CFB_YEAR}" ]; then
            cp -r "public-repo/data/history/${CFB_YEAR}/."                   "data/history/${CFB_YEAR}/"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas requests

      - name: Recalculate rankings
        run: python autostat.py

      - name: Update weekly history
        run: python autostat.py --archive-week

      - name: Copy updated files to public repo
        shell: bash
        run: |
          mkdir -p "public-repo/data"

          cp "data/${CFB_YEAR} Master.csv"              "public-repo/data/${CFB_YEAR} Master.csv"

          cp "data/${CFB_YEAR} Live.json"              "public-repo/data/${CFB_YEAR} Live.json"

          cp "data/${CFB_YEAR} Schedule.csv"              "public-repo/data/${CFB_YEAR} Schedule.csv"

          if [ -f "data/${CFB_YEAR} History.csv" ]; then
            cp "data/${CFB_YEAR} History.csv"                "public-repo/data/${CFB_YEAR} History.csv"
          fi

          if [ -d "data/history/${CFB_YEAR}" ]; then
            mkdir -p "public-repo/data/history/${CFB_YEAR}"

            cp -r "data/history/${CFB_YEAR}/."                   "public-repo/data/history/${CFB_YEAR}/"
          fi

      - name: Commit and push updated files
        working-directory: public-repo
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "data/${CFB_YEAR} Master.csv"
          git add "data/${CFB_YEAR} Live.json"
          git add "data/${CFB_YEAR} Schedule.csv"

          if [ -f "data/${CFB_YEAR} History.csv" ]; then
            git add "data/${CFB_YEAR} History.csv"
          fi

          if [ -d "data/history/${CFB_YEAR}" ]; then
            git add "data/history/${CFB_YEAR}"
          fi

          if git diff --cached --quiet; then
            echo "No ranking, schedule, live-data, or history changes to commit."
            exit 0
          fi

          git commit -m "Auto-update ${CFB_YEAR} CFB rankings"

          git pull --rebase origin main
          git push origin main
