name: Update CFB Rankings

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: cfb-rankings-update
  cancel-in-progress: true

jobs:
  update-rankings:
    runs-on: ubuntu-latest

    env:
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      CFB_YEAR: "2026"

    steps:
      - name: Check out private autostat repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas requests

      - name: Recalculate rankings
        run: python autostat.py

      - name: Check out public rankings repo
        uses: actions/checkout@v4
        with:
          repository: EricAGonzalz/CFBRankings
          token: ${{ secrets.CFB_PUBLISH_TOKEN }}
          path: public-repo

      - name: Copy updated rankings file
        run: |
          cp "data/${CFB_YEAR} Master.csv" "public-repo/data/${CFB_YEAR} Master.csv"

      - name: Commit and push updated rankings
        working-directory: public-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "data/${CFB_YEAR} Master.csv"

          if git diff --cached --quiet; then
            echo "No ranking changes to commit."
            exit 0
          fi

          git commit -m "Auto-update ${CFB_YEAR} CFB rankings"
          git push
