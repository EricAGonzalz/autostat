name: Update CFB Rankings

on:
  # Lets you run it manually from the Actions tab.
  workflow_dispatch:

  # Automatic refresh. GitHub schedules use UTC.
  # This requests an update every 15 minutes.
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

# Prevent two update jobs from writing the rankings file at the same time.
concurrency:
  group: cfb-rankings-update
  cancel-in-progress: true

jobs:
  update-rankings:
    runs-on: ubuntu-latest

    env:
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      CFB_YEAR: "2026"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas requests

      - name: Recalculate rankings
        run: python autostat.py

      - name: Commit updated rankings
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "data/${CFB_YEAR} Master.csv"

          # Do nothing if the API data has not changed since the last run.
          if git diff --cached --quiet; then
            echo "No ranking changes to commit."
            exit 0
          fi

          git commit -m "Auto-update ${CFB_YEAR} CFB rankings"
          git push
